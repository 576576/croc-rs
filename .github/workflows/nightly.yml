name: Nightly

# 每夜任务：**不属于发布链路**，失败只告警不阻塞发布。
#
# 跑四类"要么慢、要么依赖外网、要么还没稳定"的东西：
#   1. Miri —— 严格 provenance 下跑 SPAKE2 的标量乘，慢到不适合每次推送都跑；
#   2. Go 互通全矩阵 —— 要克隆并编译 Go 版 croc，且矩阵里的 I12 / I16–I18 依赖
#      尚未实现的能力，跑起来必然红；**先让红灯可见**，但不该掐断发布；
#   3. 官方 relay 互通（I6）—— 需要外网，且会打真实服务器；
#   4. 性能基准 —— 需要与基线比较，噪音大。
#
# 它们待在**独立工作流**里而不是 lint.yml：`continue-on-error` 的 job 依然会拖住
# 整个可复用工作流，而 `build` 的 `needs` 等的是整个 lint——看板不该串在链路上。
#
# 背景见 docs/agent/plan/07-risks-and-testing.md §2.1（L6）与 §2.5。

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00，避开维护窗口。
    - cron: '0 18 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: Miri
    runs-on: ubuntu-latest
    # Miri 只在 nightly 上发布——**这是整个仓库唯一使用 nightly 的地方**。
    # 产物构建链路（build.yml）里不允许出现 nightly。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: 安装 nightly + Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: 运行 Miri
        # ⚠ 先说清楚：**本仓库一行 `unsafe` 都没有**（0 处 unsafe / 0 处 FFI / 0 处
        #   transmute|from_raw|as_ptr，构建脚本里也没有 cc|bindgen）。安全 Rust 产不出
        #   UB，所以 Miri 查不出"我们自己的"内存问题。
        #
        #   它在这里做两件事：
        #     1. 跑我们测试套件所触达的**依赖里的 unsafe**——最相关的是
        #        `curve25519-dalek`（`croc-pake` 的 Ed25519 曲线走它，serial 后端是
        #        unsafe 的 limb 算术）；
        #     2. 当哨兵：以后谁在算术核心里伸手写裸指针，这里会红。
        #
        #   它是**看板不是门禁**，所以待在 nightly 而不是 lint 里。哪天真成了负担，
        #   删掉它不会丢掉任何一道真正的门禁——真正的门禁是 `[workspace.lints]` 里的
        #   `unsafe_code = "warn"` + CI 的 `-D warnings`。
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo +nightly miri test -p croc-siec -p croc-pake

  interop:
    name: Go 互通（全矩阵）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: 构建 Go 版 croc（基线 v11.5.4）
        run: |
          git clone --depth 1 --branch v11.5.4 https://github.com/schollz/croc /tmp/croc-go
          cd /tmp/croc-go
          go build -o /usr/local/bin/croc-go .
          croc-go --version
      - name: 构建 Rust 版
        run: cargo build --release -p croc-cli
      - name: 跑互通矩阵（I1–I18）
        env:
          CROC_GO_BIN: /usr/local/bin/croc-go
          CROC_RS_BIN: ${{ github.workspace }}/target/release/croc-rs
          # nightly 有外网，I6（官方 relay）也一起跑。
        run: bash tests/interop/run.sh
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-interop-logs
          path: target/interop-logs
          if-no-files-found: ignore

  interop-official:
    name: 官方 relay 互通
    runs-on: ubuntu-latest
    # 外网抖动与上游故障都不该让人半夜被叫起来 —— 这一整个 workflow 只告警。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: 构建 Go 版 croc（基线 v11.5.4）
        run: |
          git clone --depth 1 --branch v11.5.4 https://github.com/schollz/croc /tmp/croc-go
          cd /tmp/croc-go
          go build -o /usr/local/bin/croc-go .
          croc-go --version
      - name: 构建 Rust 版
        run: cargo build --release -p croc-cli
      - name: I6 · Rust → Go 走官方 relay
        env:
          CROC_GO_BIN: /usr/local/bin/croc-go
          CROC_RS_BIN: ${{ github.workspace }}/target/release/croc-rs
          # 只跑 I6（需要外网的那条），其余矩阵由 lint.yml 覆盖。
          CROC_INTEROP_ONLY: I6
        run: bash tests/interop/run.sh
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-interop-logs
          path: target/interop-logs
          if-no-files-found: ignore

  bench:
    name: 性能基准
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 跑基准
        # 指标定义见 07-risks-and-testing.md §2.5：纯加密吞吐 / 局域网吞吐 / 中继转发吞吐 /
        # 清单生成 / 握手耗时。R9 的对策是「回退超过 15% 则阻断」，所以这里把结果存成
        # 制品，人工比对上一次的数值 —— 自动比对需要一台稳定的基准机，暂不做。
        run: cargo bench --workspace -- --output-format bencher | tee bench.txt
      - name: 上传基准结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.run_id }}
          path: bench.txt
          if-no-files-found: ignore
