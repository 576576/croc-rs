name: Lint

# 质量门禁：格式 / 静态检查 / 测试 / 架构门禁 / MSRV。
#
# **互通矩阵不在这里，而且是有意不挂**：它只在本地跑（`cargo xtask ci-interop`）。
# 理由见 docs/agent/build-and-ci.md §5.3 —— 简单说，矩阵要在同一台机器上
# 同时有 Rust 版与 Go 版 croc，还原样起 18 个用例的进程，进了 CI 就成了发布链路上一段
# 又慢又不稳的环节；它的价值是"改动协议字节之后本地跑一遍"，不是"挡住某个 commit"。
#
# **不跟 push / PR**：由 release.yml 在调用 build 之前作为一个 job 调起（`workflow_call`），
# 所以发布链路上没有任何一道能绕过它；单独跑它用 workflow_dispatch。
# 决策与背景见 docs/agent/build-and-ci.md §1.2 / §5.3。
#
# 代价是 PR 阶段没有绿灯信号 —— 由本地 `cargo xtask ci-lint` 补（见 §6）。

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 检查格式
        # 规则来自根 rustfmt.toml：edition 2024 / max_width 120 / use_small_heuristics = "Max"。
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Linux 系统依赖
        # `croc-gui` 依赖 tauri，而 tauri 在 Linux 上要链接 GTK / WebKitGTK / glib。
        # 不装的话 `cargo clippy --workspace` 会在 `glib-sys` 的 build script 上直接失败——
        # 报错信息只有一句 "failed to run custom build command"，看不出缺的是系统库。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev
      - name: 静态检查
        # lint 级别由根 Cargo.toml 的 [workspace.lints] 统一定义（含 clippy::todo，
        # 所以任何 `todo!()` 占位都会在这里变成硬错误）。测试代码在 crate 根部豁免。
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Linux 系统依赖
        # `croc-gui` 依赖 tauri，而 tauri 在 Linux 上要链接 GTK / WebKitGTK / glib。
        # 不装的话 `cargo clippy --workspace` 会在 `glib-sys` 的 build script 上直接失败——
        # 报错信息只有一句 "failed to run custom build command"，看不出缺的是系统库。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev
      - name: 测试
        # --no-fail-fast：默认在第一个失败的测试二进制处就收工，一轮要拿到全部失败。
        run: cargo test --workspace --no-fail-fast

  arch:
    name: 架构门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 纯 crate 不得引入 IO
        # croc-siec / croc-pake / croc-protocol 必须保持 sans-io：不得出现 tokio /
        # std::fs / std::net / std::process / std::thread / Instant::now / 随机源。
        # 检查前先剥掉注释与字符串字面量，所以文档里提到这些名字不会误报。
        run: cargo xtask purity

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 与根 Cargo.toml 的 rust-version 一致。浮动到最新 stable 会让 MSRV 失去意义。
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Linux 系统依赖
        # `croc-gui` 依赖 tauri，而 tauri 在 Linux 上要链接 GTK / WebKitGTK / glib。
        # 不装的话 `cargo clippy --workspace` 会在 `glib-sys` 的 build script 上直接失败——
        # 报错信息只有一句 "failed to run custom build command"，看不出缺的是系统库。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev
      - name: 检查最低支持版本
        # --all-targets：测试与示例也要能编过，否则 MSRV 只是纸面数字。
        run: cargo check --workspace --all-targets
