name: Build

# 可复用构建工作流（仅 workflow_call）：只负责把包做出来。
#
# **不推导任何参数** —— 版本号、通道后缀、矩阵 include 全在 release.yml 的 prep 里算一次。
# 产物命名规则与背景见 docs/agent/build-and-ci.md §3 / §5.2。
#
# # 一个 target 一个包，包里装两个二进制
#
# `croc-rs`（CLI）与 `crocw-rs`（Tauri GUI）**不分别出包**：它们共用同一套协议后端，
# 版本必须一致，分开出包就给了"两个版本对不上"的机会。每个 target 只出一个归档，
# 名字用 CLI 的（`croc-rs-<VER>-<TGT>`），里面两个二进制都在。
#
# 唯一例外是 Android —— 它只有 GUI，出的是 APK，本来就是单独一个文件。

on:
  workflow_call:
    inputs:
      channel:
        description: alpha / beta / release —— 写入编译期 CROC_BUILD_TYPE
        required: true
        type: string
      channel_suffix:
        description: 产物名里的通道段（仅 beta 为 -beta，其余通道为空串）
        required: true
        type: string
      version_name:
        description: 版本名（alpha 为 r{count}，beta/release 为 1.y.z）
        required: true
        type: string
      count:
        description: 提交数（git rev-list --count HEAD）
        required: true
        type: string
      targets:
        description: 桌面构建矩阵 include 数组（JSON 字符串，不含 Android；可为空数组）
        required: true
        type: string
      android_targets:
        description: Android 构建矩阵 include 数组（JSON 字符串，元素含 target/abi/rust_target；可为空数组）
        required: true
        type: string
      pack_cli:
        description: 是否产出 croc-rs；桌面矩阵用，Android 不看这两个
        required: false
        type: boolean
        default: true
      pack_gui:
        description: 是否产出 crocw-rs；桌面矩阵用，Android 不看这两个
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: ${{ matrix.target }}
    # 空矩阵会让 Actions 直接报错，所以空数组时显式跳过。
    if: inputs.targets != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets) }}
    env:
      CARGO_TERM_COLOR: always
      CROC_BUILD_TYPE: ${{ inputs.channel }}
      CROC_VERSION_NAME: ${{ inputs.version_name }}
      CROC_VERSION_COUNT: ${{ inputs.count }}
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装 llvm-mingw
        if: contains(matrix.rust_target, 'gnullvm')
        shell: bash
        run: |
          set -euo pipefail
          V="20260922"
          DIR="llvm-mingw-${V}-ucrt-x86_64"
          curl -fsSL --retry 3 -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${V}/${DIR}.zip"
          python3 -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall('.')" llvm-mingw.zip
          rm -f llvm-mingw.zip
          test -x "$DIR/bin/x86_64-w64-mingw32-clang.exe" || { echo "::error::llvm-mingw 解压异常（缺 $DIR/bin）"; exit 1; }
          echo "$(pwd -W)/$DIR/bin" >> "$GITHUB_PATH"
      - name: 安装 Linux 系统依赖
        # WebKitGTK 4.1 是 Tauri 2 的运行时依赖（4.0 只够 Tauri 1）。
        # libappindicator / librsvg 供托盘与图标，patchelf 供 AppImage。
        # 只在真要编 GUI 时才装——CLI job 装它纯属浪费时间。
        if: runner.os == 'Linux' && inputs.pack_gui
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 构建 CLI
        if: inputs.pack_cli
        run: cargo build --release -p croc-cli --target ${{ matrix.rust_target }}
      - name: 安装 pnpm
        if: inputs.pack_gui
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: 安装 Node
        if: inputs.pack_gui
        uses: actions/setup-node@v7
        with:
          # 不钉具体大版本：22 已经走过 EOL，钉住的版本只会等着自己过期。
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: crates/croc-gui/ui/pnpm-lock.yaml
      - name: 构建前端
        if: inputs.pack_gui
        # `tauri.conf.json` 的 `frontendDist` 指向 `ui/dist`，而 `cargo build` 不会跑
        # `beforeBuildCommand`——少了这一步，产物是一个嵌着不存在目录的二进制：**勉强
        # 能启动，界面全白**，而且这条差异只在运行时才看得出来。
        shell: bash
        run: |
          set -euo pipefail
          cd crates/croc-gui/ui
          pnpm install --frozen-lockfile
          pnpm run build
          test -n "$(ls -A dist)" || { echo "ui/dist 是空的"; exit 1; }
      - name: 构建 GUI
        if: inputs.pack_gui
        shell: bash
        # **故意不用 `cargo tauri build`。** 那个命令要先 `cargo install tauri-cli`
        # ——从源码编一整套 clap + cargo-mobile2，实测每个 target 多花 12–15 分钟，
        # 而它替我们做的只有两件：跑前端构建（上一步已经做了，与它跑的是同一个
        # 命令）和打安装器（我们传 `--no-bundle`）。配置校验与资源内嵌由 `tauri-build`
        # （`build.rs`）在编译期做完了，所以直接 `cargo build` 的产物一模一样。
        #
        # Android 绕不开 CLI（要生成 Gradle 工程），见下面的 android job。
        run: cargo build --release -p croc-gui --target ${{ matrix.rust_target }}
      - name: 打包
        id: pack
        shell: bash
        run: |
          set -euo pipefail

          VER="${{ inputs.version_name }}"
          TGT="${{ matrix.target }}"
          BASE="croc-rs-${VER}${{ inputs.channel_suffix }}-${TGT}"

          # 判平台一律用 runner.os，别拿 matrix.os 的 runner 标签比字面量
          # （windows-latest 之外还有 windows-11-arm）。
          IS_WIN="false"
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            IS_WIN="true"
            EXT=".exe"
          fi

          STAGE="dist/${BASE}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          copied=0
          for name in croc-rs crocw-rs; do
            if [ "$name" = "croc-rs" ] && [ "${{ inputs.pack_cli }}" != "true" ]; then continue; fi
            if [ "$name" = "crocw-rs" ] && [ "${{ inputs.pack_gui }}" != "true" ]; then continue; fi
            BIN="target/${{ matrix.rust_target }}/release/${name}${EXT}"
            test -f "$BIN" || { echo "::error::找不到 $BIN"; exit 1; }
            cp "$BIN" "$STAGE/"
            copied=$((copied+1))
          done
          # 两个开关都关时 prep 已经拦过一道；这里是第二道防线，
          # 免得真的出一个空包还被发布出去。
          test "$copied" -gt 0 || { echo "::error::pack_cli 与 pack_gui 都是关的"; exit 1; }

          # LICENSE 随二进制分发（LGPL-3.0 的要求），README 顺手带上。
          cp LICENSE README.md "$STAGE/" 2>/dev/null || true

          if [ "$IS_WIN" = "true" ]; then
            ARCHIVE="dist/${BASE}.zip"
            # Git for Windows 的 bash 没有 zip / unzip，走 python3 的 zipfile。
            python3 -c "import sys,zipfile,pathlib; \
          d=pathlib.Path(sys.argv[1]); z=zipfile.ZipFile(sys.argv[2],'w',zipfile.ZIP_DEFLATED); \
          [z.write(p, p.relative_to(d.parent)) for p in sorted(d.rglob('*')) if p.is_file()]; z.close()" \
              "$STAGE" "$ARCHIVE"
          else
            ARCHIVE="dist/${BASE}.tar.gz"
            # tar -C dist：包内路径是相对名（croc-rs-<VER>-<TGT>/...），不带 dist/ 前缀。
            tar -C dist -czf "$ARCHIVE" "${BASE}"
          fi
          rm -rf "$STAGE"

          test -f "$ARCHIVE" || { echo "::error::打包失败：$ARCHIVE 不存在"; exit 1; }
          echo "packed: $ARCHIVE ($(du -h "$ARCHIVE" | cut -f1))"
          {
            echo "artifacts=$ARCHIVE"
            echo "artifact_name=$BASE"
          } >> "$GITHUB_OUTPUT"
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.artifacts }}

  android:
    name: Android ${{ matrix.target }}
    # 与桌面矩阵同一套写法：include 由调用方按勾选拼好，空数组时整个 job 跳过。
    if: inputs.android_targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.android_targets) }}
    env:
      CARGO_TERM_COLOR: always
      CROC_BUILD_TYPE: ${{ inputs.channel }}
      CROC_VERSION_NAME: ${{ inputs.version_name }}
      CROC_VERSION_COUNT: ${{ inputs.count }}
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}
      - name: 安装 JDK
        # Tauri 2 的 Android 模板用 AGP 8.x，需要 JDK 17+。
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 包之间用空格分隔；写成逗号会被当作一个包名。
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools ndk;27.3.13750724'
      - name: Android SDK 环境
        # ubuntu 镜像已预装 platforms;android-37.2 / build-tools;37.0.0 / NDK，并导出
        # ANDROID_HOME 与 ANDROID_NDK_HOME，所以这里只做校验与补齐，不装包：
        # sdkmanager 已废弃（Android CLI 的 `android sdk` 取代它），setup-android 仍是
        # 调 sdkmanager 去装的，在新镜像上必然失败。
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK/platforms/android-37" || { echo "::error::缺 platforms;android-37"; exit 1; }
          # 优先用镜像导出的默认 NDK，没有再退回目录里版本号最大的那个。
          NDK="${ANDROID_NDK_HOME:-}"
          [ -n "$NDK" ] || NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)"
          test -d "${NDK:?找不到 NDK}" || exit 1

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "NDK_HOME=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
          } >> "$GITHUB_ENV"
          echo "SDK=$SDK NDK=$NDK"
      - name: 安装 Tauri CLI
        # Android 这条路径绕不开 CLI（要生成 Gradle 工程）。`cargo install` 会从源码
        # 编一遍，约 12–15 分钟——所以 Android 默认关闭，只在真出 APK 时付这个代价。
        run: cargo install tauri-cli --version '^2' --locked
      - name: 初始化 Android 工程
        # gen/android 是生成物（已 gitignore），每次构建现生成，避免模板漂移。
        working-directory: crates/croc-gui
        run: cargo tauri android init
      - name: 准备签名
        working-directory: crates/croc-gui
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # 预发布签名：密钥与口令都写在这里，只用来签 alpha 与没有 secret 时的构建，
          # 不参与正式发布。它的包名是 .pr 变体，可以和正式版装在同一台机器上。
          PR_KEYSTORE_BASE64: ''
        shell: bash
        run: |
          set -euo pipefail

          USE_PR="false"
          if [ "${{ inputs.channel }}" = "alpha" ] \
            || [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] \
            || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            USE_PR="true"
          fi

          if [ "$USE_PR" = "true" ]; then
            KS_B64="$PR_KEYSTORE_BASE64"
            KS_PW="crocw-prerelease"
            KS_ALIAS="crocw-pr"
            KS_KP="crocw-prerelease"
            echo "CROC_ANDROID_APPLICATION_ID=cn.sumitm.crocw.pr" >> "$GITHUB_ENV"
            sed -i 's|<string name="app_name">"[^"]*"|<string name="app_name">"Crocw PR"|' \
              gen/android/app/src/main/res/values/strings.xml \
              gen/android/app/src/main/res/values-zh-rCN/strings.xml
          else
            KS_B64="$ANDROID_KEYSTORE_BASE64"
            KS_PW="$ANDROID_KEYSTORE_PASSWORD"
            KS_ALIAS="$ANDROID_KEY_ALIAS"
            KS_KP="$ANDROID_KEY_PASSWORD"
          fi

          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/crocw.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/crocw.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PW"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KS_KP"
          } >> "$GITHUB_ENV"
          echo "signature: $([ "$USE_PR" = "true" ] && echo prerelease || echo release)"
      - name: 构建 APK
        working-directory: crates/croc-gui
        run: cargo tauri android build --apk --target ${{ matrix.abi }}
      - name: 打包产物
        id: pack
        shell: bash
        run: |
          set -euo pipefail

          VER="${{ inputs.version_name }}"
          TGT="${{ matrix.target }}"
          NAME="crocw-rs-${VER}${{ inputs.channel_suffix }}-${TGT}"

          # APK 的落盘路径随 Tauri 版本变化（universal / 分 ABI），用 find 兜住。
          APK="$(find crates/croc-gui/gen/android/app/build/outputs/apk -name '*.apk' -print -quit 2>/dev/null || true)"
          test -n "$APK" || {
            echo "::error::找不到 APK，输出目录内容："
            find crates/croc-gui/gen/android/app/build/outputs 2>/dev/null | head -50
            exit 1
          }
          mkdir -p dist
          cp "$APK" "dist/${NAME}.apk"
          echo "packed: dist/${NAME}.apk ($(du -h "dist/${NAME}.apk" | cut -f1))"
          {
            echo "artifacts=dist/${NAME}.apk"
            echo "artifact_name=$NAME"
          } >> "$GITHUB_OUTPUT"
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.artifacts }}
