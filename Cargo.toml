[workspace]
resolver = "3"
members = [
    "crates/croc-siec",
    "crates/croc-pake",
    "crates/croc-pakekey",
    "crates/croc-protocol",
    "crates/croc-net",
    "crates/croc-core",
    "crates/croc-relay",
    "crates/croc-store",
    "crates/croc-engine",
    "crates/croc-cli",
    "crates/croc-gui",
    "xtask",
]

# 全 workspace 统一的 lint 配置，对齐 Suwayomi-next。各 crate 用
# `[lints] workspace = true` 继承（Rust 1.74+）。CI 跑 `-D warnings`，所以这里
# 每一条 `warn` 都是硬门禁。
#
# 注意 `todo = "warn"`：禁止用 `todo!()` 占位。未实现的路径要返回
# `Err(...Unavailable)` 并走降级逻辑，见 docs/agent/architecture.md §8.3。
[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
# panic 三件套：生产代码一律 warn，测试里的例外写在各 crate 根部。
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
# 异步正确性：持锁跨 await 是死锁温床。
await_holding_lock = "warn"

# ---- 控制流函数式化（全部按"归零"要求写）----
# 索引循环与下标访问：越界 panic 的根源，改用 `.get()` / 迭代器 / 切片。
indexing_slicing = "warn"
# 本可用组合子却写了 match / if-let。
manual_let_else = "warn"
map_unwrap_or = "warn"
option_if_let_else = "warn"
# 其余控制流形状。
needless_continue = "warn"
useless_let_if_seq = "warn"
match_same_arms = "warn"
single_match_else = "warn"
branches_sharing_code = "warn"
if_same_then_else = "warn"
# 累积器与容器用法。
iter_with_drain = "warn"
needless_collect = "warn"
single_option_map = "warn"
unnecessary_wraps = "warn"
# 表达式化细节。
semicolon_if_nothing_returned = "warn"
items_after_statements = "warn"
ignored_unit_patterns = "warn"
# 命名与签名整洁度。
unused_self = "warn"
redundant_closure_for_method_calls = "warn"
elidable_lifetime_names = "warn"
use_self = "warn"
similar_names = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "LGPL-3.0-or-later"
repository = "https://github.com/576576/croc-rs"
authors = ["croc-rs contributors"]
description = "A Rust rewrite of croc: send files anywhere, simply and securely."

[workspace.dependencies]
# ---- 大整数与曲线算术 ----
# 线路字节按 Go `math/big` 的语义来：欧几里得取模、十进制 JSON 数字。
num-bigint = "0.5"
num-traits = "0.2"
# pake v3 的第五条曲线：Ed25519。
curve25519-dalek = { version = "5", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }

# ---- 加密栈 ----
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
# 中继握手的密钥派生：Go 用 `pbkdf2.Key(strongKey, salt, 100, 32, sha256.New)`。
# 迭代次数只有 100，这是 croc 的既有设计（弱口令只是用来给中继鉴权，不是给用户口令）。
pbkdf2 = "0.13"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
aes-gcm = "0.11"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# ---- 序列化 ----
# Go 的 `[]byte` 在 JSON 里是标准 base64（带 padding），所以字节字段要自己接管编解码，
# 见 croc-protocol 的 `base64_bytes`。
serde = { version = "1", features = ["derive"] }
base64 = "0.23"
# RFC3339 编解码：Go 的 `time.Time` 在 JSON 里是 RFC3339Nano。
time = { version = "0.3", features = ["serde-well-known"] }
# ---- `--hash` 的四种算法 ----
md-5 = "0.11"
highway = "1"
imohash = "0.1"

# ---- 基础工具 ----
thiserror = "2"
tracing = "0.1"

# ---- 异步与 IO ----
# 纯 crate（croc-protocol / croc-pake / croc-siec）碰 tokio 会被 `cargo xtask purity`
# 挡下，其余 crate 随意。
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs"] }
# 取消令牌。所有 `select!` 都必须带 `cancelled()` 分支，否则 Ctrl-C 会留下半截文件。
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
# 只为 `--local` 的组播监听设置 `SO_REUSEADDR`：`std::net::UdpSocket` 不暴露它，
# 而同一台机器上发送方与接收方常常同时在收同一个组播端口。
socket2 = "0.6"
ignore = "0.4"
zip = "9"
# `--qrcode`：只用它的编码器，渲染是自己拼的半角块字符，所以关掉默认的
# image / svg 特性（那俩会拉一整套图形依赖）。
qrcode = { version = "0.14", default-features = false }
# ---- stored transfer（`croc store`）的 HTTP 客户端 ----
# `socks` 是 `--socks5` 要的；TLS 走 rustls。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks"] }

# ---- 清单里的文件名校验 ----
# 名字要在所有支持的平台上都安全，所以不能只看 ASCII：Windows / macOS 的文件系统
# 大小写不敏感、对归一化也不敏感，`a.txt` 与 `A.txt` 会互相覆盖。这三条是 Go 的
# `receivefs` 用到的同一套判定。
unicode-normalization = "0.1"
caseless = "0.2"
unicode-general-category = "1"
# `--socks5`：只做 CONNECT。
tokio-socks = "0.5"
getrandom = "0.4"

# ---- 仅测试用 ----
# 基准向量是 JSON，十六进制字段用 `hex` 解。
serde_json = "1"
hex = "0.4"

# ---- workspace 内部 crate ----
croc-siec = { path = "crates/croc-siec" }
croc-pake = { path = "crates/croc-pake" }
croc-pakekey = { path = "crates/croc-pakekey" }
croc-protocol = { path = "crates/croc-protocol" }
croc-net = { path = "crates/croc-net" }
croc-core = { path = "crates/croc-core" }
croc-relay = { path = "crates/croc-relay" }
croc-store = { path = "crates/croc-store" }
croc-engine = { path = "crates/croc-engine" }
croc-cli = { path = "crates/croc-cli" }
croc-gui = { path = "crates/croc-gui" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
