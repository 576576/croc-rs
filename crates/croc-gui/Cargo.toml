[package]
name = "croc-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The croc-rs desktop and Android GUI (Tauri 2). The binary is crocw-rs."

[lib]
name = "croc_gui"
# Android 要 cdylib（JNI 入口），桌面要 rlib（给 bin 用）。staticlib 留给 iOS。
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "crocw-rs"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
croc-protocol.workspace = true
croc-core.workspace = true
croc-engine.workspace = true
croc-pake.workspace = true
croc-net.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
