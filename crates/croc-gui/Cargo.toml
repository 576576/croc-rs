[package]
name = "croc-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The croc-rs desktop and Android GUI (Tauri 2). The binary is crocw-rs."

[lib]
name = "croc_gui"
# Android 要 cdylib（JNI 入口），桌面要 rlib（给 bin 用）。staticlib 留给 iOS。
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "crocw-rs"
path = "src/main.rs"

[lints]
workspace = true

[features]
# 生产构建必须开。不开它 Tauri 就是 dev 模式：运行时去连 `devUrl`
# （http://localhost:1420）而不是用编译期嵌入的前端资源，产物打开只是"localhost
# 拒绝连接"。`tauri build` 会自动加这个 feature，`cargo build` 不会。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Rust → Kotlin 的桥（`src/android.rs`）。只有 Android 要，桌面端不该把它们链接进来。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dependencies]
croc-protocol.workspace = true
croc-core.workspace = true
croc-engine.workspace = true
croc-pake.workspace = true
croc-net.workspace = true
croc-store.workspace = true
time.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rust-i18n = "4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
