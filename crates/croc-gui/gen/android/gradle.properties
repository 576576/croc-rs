# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Our old plugin template had a bug that caused missing `consumer-rules.pro` files
# so we have to disable it for now.
# See https://github.com/tauri-apps/tauri/pull/15828#issuecomment-5199937796
android.proguard.failOnMissingFiles=false

# AGP 9 默认 android.builtInKotlin=true。app/build.gradle.kts 已显式应用
# org.jetbrains.kotlin.android，两个 Kotlin 插件同时生效会让构建失败
# （AGP 的 BooleanOption.BUILT_IN_KOTLIN：If the user applies both plugins,
# the build will fail.），所以这个开关必须保留。
# 上游注释里的 Gradle 9 兼容说法已过时：build.gradle.kts 用的是 AGP 9.3.1 + Gradle 9。
android.builtInKotlin=false

# 上游 tauri 与全部 tauri-plugin-* 的 android 模块都写 sourceCompatibility 1.8，
# 只把本模块抬到 11/17 会让模块间编译级别不一致，警告也依旧由上游模块发出。
# AGP 给的三条出路里，toolchain 那条走不通（ApplicationExtension 没有 toolchain 入口），
# 剩下只能压警告。
android.sync.suppressAgpWarnings=JAVA_COMPILE_DEPRECATED_SOURCE_TARGET
android.javaCompile.suppressSourceTargetDeprecationWarning=true
