<!doctype html>
<!--
  data-theme 要在 React 挂载前落到确定值，否则第一帧会闪白：这段脚本与 src/theme.ts
  的取值顺序必须一致（localStorage → 系统 → 深色兜底）。
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- `user-scalable=no` 关掉 Android WebView 与 WKWebView 自己的双指缩放：界面按固定
         版式排的，放大之后按钮会跑出屏幕。桌面端的轨道缩放由 main.tsx 那条 wheel 钩子挡。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#121411" />
    <title>croc</title>
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('croc-web-theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
        } catch (error) {
          theme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
